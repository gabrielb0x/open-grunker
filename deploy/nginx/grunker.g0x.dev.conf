# ═══════════════════════════════════════════════════════════════════════════
# Open Grunker — grunker.g0x.dev
#
#   https://grunker.g0x.dev/            game client (the Vite build, served by nginx)
#   https://grunker.g0x.dev/api/v1/     REST API      -> 127.0.0.1:7420
#   wss://grunker.g0x.dev/ws            realtime game -> 127.0.0.1:7420
#   https://grunker.g0x.dev/avatars/    user uploads: profile and clan pictures,
#                                       and creators' anthems -> 127.0.0.1:7420
#   /admin and /api/v1/admin            blocked here; local machine only
#
# Install:  sudo bash /opt/open-grunker/scripts/deploy-nginx.sh
# Requires: the $connection_upgrade map from nginx.conf (already present here),
#           a DNS record for grunker.g0x.dev pointing at this host, and a client
#           built with `npm run build` — the root below is the build, not the
#           sources it is built from.
# ═══════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS ───────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name grunker.g0x.dev;
    return 301 https://$host$request_uri;
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grunker.g0x.dev;

    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:GrunkerSSL:2m;
    ssl_session_timeout 1h;

    root  /opt/open-grunker/client/dist;
    index index.html;

    # The game needs its own canvas and WebGL context; SAMEORIGIN framing only.
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # three.js and the map payloads compress extremely well.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/wasm image/svg+xml;

    # Large enough for a profile picture upload (AVATAR_MAX_BYTES, 192 KB by
    # default) with room to spare; the API refuses anything past its own limit.
    client_max_body_size 1m;

    # ── Realtime game socket ───────────────────────────────────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:7420;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Matches are long; never time a live player out mid-game.
        proxy_read_timeout  7d;
        proxy_send_timeout  7d;
        proxy_buffering     off;
        tcp_nodelay         on;
    }

    # ── Admin panel: never exposed publicly ────────────────────────────────
    # The panel and its API are for the machine itself (http://127.0.0.1:7420/admin).
    # The Node server also refuses any admin request that arrived through a
    # proxy, so this is the outer of two locks rather than the only one.
    location ^~ /admin {
        return 404;
    }

    location ^~ /api/v1/admin {
        return 404;
    }

    # ── Versioned REST API ─────────────────────────────────────────────────
    # /api/v1/... is handled by the Node server, which also answers /api and
    # unknown versions with a helpful 404 naming the supported versions.
    # `= /api` and `/api/` both reach the server, which answers a bare /api and
    # unknown versions with JSON naming the versions it does support.
    location = /api {
        proxy_pass         http://127.0.0.1:7420;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:7420;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  X-Powered-By;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location = /healthz {
        proxy_pass       http://127.0.0.1:7420;
        proxy_set_header Host $host;
        access_log       off;
    }

    # ── User uploads: pictures, clan pictures, anthems ─────────────────────
    # They live under data/ with the database, not in the client root,
    # so they are proxied rather than served from disk here. `^~` matters twice:
    # the image regex location below would otherwise win and look for
    # /avatars/12-ab34.webp under the client root, which is a 404 — and `^~`
    # also stops nginx before its regex locations for *everything* under this
    # prefix, which is why clan pictures live at /avatars/clans/<file> rather
    # than at a prefix of their own, and creators' anthems at
    # /avatars/anthems/<file>. Adding a new kind of user content under here
    # needs no change to this file at all — which is the whole reason they are
    # all under one prefix rather than each having its own.
    location ^~ /avatars/ {
        proxy_pass         http://127.0.0.1:7420;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  X-Powered-By;
        # The filename carries a content hash, so the server's own long
        # max-age is safe to pass straight through.
    }

    # ── Shared game code (physics/weapons/maps used by client and server) ──
    # `^~` so this wins over the static-asset regex location below; without it
    # /shared/movement.js would be looked up under the client root and 404.
    location ^~ /shared/ {
        alias /opt/open-grunker/shared/;
        types { application/javascript js; }
        default_type application/javascript;
        # Physics that must match the server byte for byte: never serve a stale copy.
        add_header Cache-Control "no-cache";
    }

    # ── Static client ──────────────────────────────────────────────────────
    # Every chunk under /assets/ is named after a hash of its own contents, so
    # its URL changes the moment the file does and no browser ever has to ask
    # about one twice. The one exception under this prefix is the favicon: the
    # build pins its name because the admin panel asks for it by name, and a
    # fixed URL cannot be cached for a year.
    location = /assets/favicon.svg {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Anything else ending in .js or .css is unversioned; `no-cache` still 304s
    # on the ETag — it revalidates, it does not re-download.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/grunker.access.log;
    error_log  /var/log/nginx/grunker.error.log warn;
}
